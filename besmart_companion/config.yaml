name: "BeSmart Companion"
slug: "besmart_companion"
description: "Local setup companion for BeSmart Home Server"
version: "1.0.15"

arch:
  - aarch64
  - amd64

image: "ghcr.io/besmarthome/besmart-companion"

init: false
startup: services
boot: auto

host_network: true

options:
  backend_signing_public_key: ""
  e2ee_pairing_authorization: {}
schema:
  backend_signing_public_key: "str?"
  e2ee_pairing_authorization:
    token: "str?"
    expires_at: "str?"
