name: Publish BeSmart Companion

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: besmarthome/besmart-companion

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep '^version:' besmart_companion/config.yaml | sed 's/version:[[:space:]]*//' | tr -d '"')
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${VERSION}"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./besmart_companion
          file: ./besmart_companion/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOSYNC_COMPANION_VERSION=${{ steps.version.outputs.version }}
            SOSYNC_COMPANION_BUILD=${{ steps.version.outputs.version }}-secure-remote-e2ee-ws-control-frame-v1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
